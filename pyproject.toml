[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarves-ai"
version = "0.1.0"
description = "Lokaler Windows-11-Entwicklungsassistent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary / User-defined" }
authors = [
    { name = "Jarves Team" }
]
dependencies = [
    "PySide6>=6.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
jarves = "jarves.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "pytestqt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-q -m 'not integration and not ollama and not slow'"
markers = [
    "integration: integration tests requiring specific local services or external setups",
    "ollama: tests requiring running local Ollama service",
    "slow: slow running tests (benchmarks, long timeouts)",
    "ui: UI tests with Qt/pytest-qt",
]
